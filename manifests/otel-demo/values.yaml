# Helm values — open-telemetry/opentelemetry-demo, BASELINE (pre-swap) state.
# Pinned to chart 0.40.10 / app 2.2.0.
#
#   helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
#   helm repo update
#   helm upgrade --install otel-demo open-telemetry/opentelemetry-demo \
#     -n otel-demo --create-namespace --version 0.40.10 -f manifests/otel-demo/values.yaml
#
# The bundled Postgres (`postgresql`) is ENABLED here; the live Everest swap
# overlay (manifests/everest/otel-demo-everest-values.yaml) disables it.
# frontend-proxy is a LoadBalancer so the storefront gets an external IP.
#
# NOTE: `frontend-proxy` is a COMPONENT — it must live under `components:` (chart
# 0.40.10 `values.schema.json` sets additionalProperties=false at the root, so a
# root-level `frontend-proxy:` fails with "Additional property ... not allowed").
# The `jaeger`/`grafana`/`prometheus`/`opensearch`/`opentelemetry-collector` keys
# ARE root-level (they are conditional sub-charts, not components).
components:
  postgresql:
    enabled: true
  frontend-proxy:
    service:
      type: LoadBalancer
opentelemetry-collector:
  enabled: true
jaeger:
  enabled: true
grafana:
  enabled: true
prometheus:
  enabled: true
opensearch:
  enabled: true
